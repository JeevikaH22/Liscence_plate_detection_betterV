<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>License Plate Detection</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    * { font-family: 'Inter', sans-serif; box-sizing: border-box; }

    body {
      background: #f0f4ff;
      min-height: 100vh;
      padding: 2.5rem 1rem 6rem;
      position: relative;
      overflow-x: hidden;
    }

    /* Background scene */
    .bg-scene {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: linear-gradient(135deg, #e8eeff 0%, #f5f0ff 50%, #e8f4ff 100%);
      overflow: hidden;
    }
    .grid-overlay {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(99,102,241,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(99,102,241,0.05) 1px, transparent 1px);
      background-size: 48px 48px;
    }
    .orb {
      position: absolute;
      border-radius: 50%;
      opacity: 0.15;
      animation: floatOrb 12s ease-in-out infinite;
    }
    .orb-1 { width: 400px; height: 400px; background: #6366f1; top: -120px; left: -100px; }
    .orb-2 { width: 280px; height: 280px; background: #8b5cf6; bottom: 100px; right: -80px; animation-delay: 4s; }
    .orb-3 { width: 200px; height: 200px; background: #3b82f6; top: 50%; left: 60%; animation-delay: 7s; }
    @keyframes floatOrb {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-28px); }
    }

    /* Road */
    .road {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 80px;
      background: #2d3748;
      border-top: 4px solid #4a5568;
      z-index: 1;
    }
    .road-line {
      position: absolute;
      top: 50%; transform: translateY(-50%);
      height: 6px; width: 80px;
      background: #fbbf24; border-radius: 3px;
      animation: roadLine 2s linear infinite;
    }
    .road-line:nth-child(1) { left: -80px; animation-delay: 0s; }
    .road-line:nth-child(2) { left: -80px; animation-delay: 0.5s; }
    .road-line:nth-child(3) { left: -80px; animation-delay: 1s; }
    .road-line:nth-child(4) { left: -80px; animation-delay: 1.5s; }
    @keyframes roadLine {
      to { transform: translateY(-50%) translateX(calc(100vw + 80px)); }
    }
    .car {
      position: fixed;
      bottom: 14px;
      animation: carDrive 10s linear infinite;
      z-index: 2;
    }
    @keyframes carDrive {
      0% { left: -180px; }
      100% { left: calc(100vw + 180px); }
    }

    /* Main container */
    .container {
      position: relative;
      z-index: 10;
      max-width: 860px;
      margin: 0 auto;
    }

    /* Top bar */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      animation: slideDown 0.5s ease both;
    }
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .topbar h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: #1e1b4b;
      display: flex; align-items: center; gap: 10px;
    }
    .topbar h1 .icon {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
    }
    .btn-back {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 0.5rem 1rem;
      background: white;
      border: 1px solid #e0e7ff;
      border-radius: 10px;
      font-size: 0.875rem;
      font-weight: 500;
      color: #4338ca;
      text-decoration: none;
      transition: all 0.2s ease;
      box-shadow: 0 2px 8px rgba(99,102,241,0.1);
    }
    .btn-back:hover {
      background: #eef2ff;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(99,102,241,0.15);
    }

    /* Image card */
    .card {
      background: rgba(255,255,255,0.88);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.95);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(99,102,241,0.12), 0 2px 8px rgba(0,0,0,0.06);
      animation: cardIn 0.6s 0.1s cubic-bezier(0.22,1,0.36,1) both;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(24px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Image section */
    .img-section {
      position: relative;
      overflow: hidden;
      border-bottom: 1px solid #e0e7ff;
    }
    .img-section img {
      width: 100%;
      object-fit: contain;
      display: block;
      max-height: 400px;
    }
    /* Scan animation overlay */
    .scan-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .scan-line {
      position: absolute;
      left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(99,102,241,0.7), transparent);
      animation: scanLine 2s ease-in-out 3;
    }
    @keyframes scanLine {
      0% { top: 0; opacity: 1; }
      100% { top: 100%; opacity: 0; }
    }
    .corner-tl, .corner-tr, .corner-bl, .corner-br {
      position: absolute;
      width: 24px; height: 24px;
      border-color: #6366f1;
      border-style: solid;
      opacity: 0;
      animation: cornersIn 0.4s 0.5s ease both;
    }
    .corner-tl { top: 12px; left: 12px; border-width: 2px 0 0 2px; border-radius: 4px 0 0 0; }
    .corner-tr { top: 12px; right: 12px; border-width: 2px 2px 0 0; border-radius: 0 4px 0 0; }
    .corner-bl { bottom: 12px; left: 12px; border-width: 0 0 2px 2px; border-radius: 0 0 0 4px; }
    .corner-br { bottom: 12px; right: 12px; border-width: 0 2px 2px 0; border-radius: 0 0 4px 0; }
    @keyframes cornersIn {
      from { opacity: 0; transform: scale(1.3); }
      to { opacity: 0.7; transform: scale(1); }
    }

    /* Info grid */
    .info-section {
      padding: 1.5rem;
    }
    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 1.25rem;
    }
    .info-tile {
      background: #f5f3ff;
      border: 1px solid #ddd6fe;
      border-radius: 14px;
      padding: 1rem 1.125rem;
      animation: tileIn 0.5s ease both;
    }
    .info-tile:nth-child(1) { animation-delay: 0.2s; }
    .info-tile:nth-child(2) { animation-delay: 0.3s; }
    .info-tile:nth-child(3) { animation-delay: 0.4s; }
    .info-tile:nth-child(4) { animation-delay: 0.5s; }
    @keyframes tileIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .info-tile .tile-label {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #7c3aed;
      margin-bottom: 4px;
    }
    .info-tile .tile-value {
      font-size: 1rem;
      font-weight: 600;
      color: #1e1b4b;
    }
    .info-tile .tile-icon {
      font-size: 1.4rem;
      margin-bottom: 6px;
    }

    /* Plate display */
    .plate-display {
      background: linear-gradient(135deg, #1e1b4b, #312e81);
      border-radius: 14px;
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.25rem;
      animation: tileIn 0.5s 0.15s ease both;
      box-shadow: 0 4px 20px rgba(99,102,241,0.25);
    }
    .plate-display .label {
      font-size: 0.75rem;
      color: #a5b4fc;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .plate-display .plate-number {
      font-size: 2rem;
      font-weight: 700;
      color: #fbbf24;
      letter-spacing: 0.12em;
      font-family: 'Courier New', monospace;
      text-shadow: 0 0 20px rgba(251,191,36,0.5);
    }
    .plate-display .confidence-badge {
      background: rgba(167,243,208,0.15);
      border: 1px solid rgba(167,243,208,0.3);
      color: #6ee7b7;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 8px;
    }

    /* Action buttons */
    .action-row {
      display: flex;
      gap: 12px;
      animation: tileIn 0.5s 0.55s ease both;
    }
    .btn-download {
      flex: 1;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 0.75rem;
      background: linear-gradient(135deg, #059669, #10b981);
      color: white;
      text-decoration: none;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(16,185,129,0.3);
    }
    .btn-download:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(16,185,129,0.4);
    }
    .btn-open {
      flex: 1;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 0.75rem;
      background: linear-gradient(135deg, #1e1b4b, #4338ca);
      color: white;
      text-decoration: none;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(67,56,202,0.3);
    }
    .btn-open:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(67,56,202,0.4);
    }
  </style>
</head>
<body>

  <!-- Graphical background -->
  <div class="bg-scene">
    <div class="grid-overlay"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="road">
      <div class="road-line"></div>
      <div class="road-line"></div>
      <div class="road-line"></div>
      <div class="road-line"></div>
    </div>
    <div class="car" style="animation-duration:11s;">
      <svg width="140" height="55" viewBox="0 0 140 55" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="10" y="24" width="120" height="24" rx="8" fill="#4f46e5"/>
        <path d="M30 24 L45 8 L95 8 L110 24Z" fill="#6366f1"/>
        <rect x="48" y="10" width="20" height="12" rx="2" fill="#bfdbfe" opacity="0.9"/>
        <rect x="72" y="10" width="20" height="12" rx="2" fill="#bfdbfe" opacity="0.9"/>
        <circle cx="32" cy="48" r="9" fill="#1e1b4b"/>
        <circle cx="32" cy="48" r="5" fill="#c7d2fe"/>
        <circle cx="108" cy="48" r="9" fill="#1e1b4b"/>
        <circle cx="108" cy="48" r="5" fill="#c7d2fe"/>
        <rect x="112" y="28" width="14" height="6" rx="2" fill="#fde68a" opacity="0.9"/>
        <rect x="14" y="30" width="8" height="4" rx="1" fill="#fca5a5" opacity="0.9"/>
      </svg>
    </div>
  </div>

  <div class="container">
    <!-- Top bar -->
    <div class="topbar">
      <h1>
        <div class="icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="7" width="20" height="10" rx="2"/>
            <path d="M6 11h.01M18 11h.01M9 11h6"/>
          </svg>
        </div>
        Detection Result
      </h1>
      <a href="/" class="btn-back">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Upload New
      </a>
    </div>

    <!-- Main card -->
    <div class="card">

      <!-- Image section -->
      <div class="img-section">
        <img
          src="{{ url_for('static', filename='uploads/' + img_name) }}?v={{ moment }}"
          alt="Detection Result">
        <div class="scan-overlay">
          <div class="scan-line"></div>
          <div class="corner-tl"></div>
          <div class="corner-tr"></div>
          <div class="corner-bl"></div>
          <div class="corner-br"></div>
        </div>
      </div>

      <!-- Info section -->
      <div class="info-section">

        <!-- Plate number display -->
        <div class="plate-display">
          <div>
            <div class="label">Detected Plate</div>
            <div class="plate-number">{{ plate_text if plate_text else "—" }}</div>
          </div>
          <div class="confidence-badge">✓ Detected</div>
        </div>

        <!-- Info tiles -->
        <div class="info-grid">
          <div class="info-tile">
            <div class="tile-icon">🎯</div>
            <div class="tile-label">Detection Target</div>
            <div class="tile-value">License Plate</div>
          </div>
          <div class="info-tile">
            <div class="tile-icon">🤖</div>
            <div class="tile-label">Model</div>
            <div class="tile-value">YOLOv8</div>
          </div>
          <div class="info-tile">
            <div class="tile-icon">📁</div>
            <div class="tile-label">File</div>
            <div class="tile-value" style="font-size:0.82rem; word-break:break-all;">{{ img_name }}</div>
          </div>
          <div class="info-tile">
            <div class="tile-icon">⚡</div>
            <div class="tile-label">Status</div>
            <div class="tile-value" style="color:#059669;">Success</div>
          </div>
        </div>

        <!-- Action buttons -->
        <div class="action-row">
          <a href="{{ url_for('static', filename='uploads/' + img_name) }}" download class="btn-download">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Download Image
          </a>
          <a href="{{ url_for('static', filename='uploads/' + img_name) }}" target="_blank" class="btn-open">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
            Open Full Image
          </a>
        </div>

      </div>
    </div>
  </div>

</body>
</html>
