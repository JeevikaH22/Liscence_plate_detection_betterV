<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>License Plate Detection</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    * { font-family: 'Inter', sans-serif; }

    body {
      background: #f0f4ff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* Animated graphical background */
    .bg-scene {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background: linear-gradient(135deg, #e8eeff 0%, #f5f0ff 50%, #e8f4ff 100%);
    }

    /* Road at bottom */
    .road {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 90px;
      background: #2d3748;
      border-top: 4px solid #4a5568;
    }
    .road-line {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      height: 6px;
      width: 80px;
      background: #fbbf24;
      border-radius: 3px;
      animation: roadLine 2s linear infinite;
    }
    .road-line:nth-child(1) { left: -80px; animation-delay: 0s; }
    .road-line:nth-child(2) { left: -80px; animation-delay: 0.5s; }
    .road-line:nth-child(3) { left: -80px; animation-delay: 1s; }
    .road-line:nth-child(4) { left: -80px; animation-delay: 1.5s; }

    @keyframes roadLine {
      0% { transform: translateY(-50%) translateX(0); }
      100% { transform: translateY(-50%) translateX(calc(100vw + 80px)); }
    }

    /* Floating car silhouette */
    .car {
      position: absolute;
      bottom: 18px;
      animation: carDrive 8s linear infinite;
      opacity: 0.85;
    }
    .car svg { filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3)); }

    @keyframes carDrive {
      0%   { left: -200px; }
      100% { left: calc(100vw + 200px); }
    }

    /* Floating orbs */
    .orb {
      position: absolute;
      border-radius: 50%;
      opacity: 0.18;
      animation: floatOrb 12s ease-in-out infinite;
    }
    .orb-1 { width: 340px; height: 340px; background: #6366f1; top: -80px; left: -80px; animation-delay: 0s; }
    .orb-2 { width: 260px; height: 260px; background: #8b5cf6; bottom: 120px; right: -60px; animation-delay: 3s; }
    .orb-3 { width: 180px; height: 180px; background: #3b82f6; top: 40%; left: 30%; animation-delay: 6s; }

    @keyframes floatOrb {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-30px) scale(1.05); }
    }

    /* Grid lines */
    .grid-overlay {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(99,102,241,0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(99,102,241,0.06) 1px, transparent 1px);
      background-size: 48px 48px;
    }

    /* Scanning dots */
    .scan-dot {
      position: absolute;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #6366f1;
      opacity: 0;
      animation: scanPulse 4s ease-in-out infinite;
    }
    @keyframes scanPulse {
      0%, 100% { opacity: 0; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.8); }
    }

    /* Main card */
    .main-card {
      position: relative;
      z-index: 10;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 24px;
      padding: 2.5rem;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 20px 60px rgba(99,102,241,0.15), 0 4px 16px rgba(0,0,0,0.08);
      animation: cardIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(32px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Icon badge */
    .icon-badge {
      width: 64px; height: 64px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1.5rem;
      box-shadow: 0 8px 24px rgba(99,102,241,0.35);
      animation: badgePop 0.7s 0.2s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    @keyframes badgePop {
      from { opacity: 0; transform: scale(0.7) rotate(-10deg); }
      to { opacity: 1; transform: scale(1) rotate(0deg); }
    }

    /* Title */
    h1.title {
      font-size: 1.75rem;
      font-weight: 700;
      color: #1e1b4b;
      text-align: center;
      margin-bottom: 0.35rem;
    }
    p.subtitle {
      text-align: center;
      color: #6b7280;
      font-size: 0.95rem;
      margin-bottom: 2rem;
    }

    /* Upload zone */
    .upload-zone {
      border: 2px dashed #c7d2fe;
      border-radius: 16px;
      padding: 2rem 1rem;
      text-align: center;
      background: rgba(238, 242, 255, 0.6);
      transition: all 0.2s ease;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }
    .upload-zone:hover {
      border-color: #6366f1;
      background: rgba(238, 242, 255, 0.9);
    }
    .upload-zone::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, transparent 40%, rgba(99,102,241,0.04));
      pointer-events: none;
    }
    .upload-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }
    .upload-icon {
      width: 48px; height: 48px;
      margin: 0 auto 0.75rem;
      background: #eef2ff;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      color: #6366f1;
    }
    .upload-zone p.upload-label {
      font-weight: 600;
      color: #4338ca;
      font-size: 0.95rem;
      margin-bottom: 0.2rem;
    }
    .upload-zone p.upload-hint {
      color: #9ca3af;
      font-size: 0.8rem;
    }

    /* Submit button */
    .btn-detect {
      width: 100%;
      margin-top: 1.25rem;
      padding: 0.85rem;
      background: linear-gradient(135deg, #6366f1, #7c3aed);
      color: white;
      border: none;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 4px 16px rgba(99,102,241,0.35);
    }
    .btn-detect:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(99,102,241,0.45);
    }
    .btn-detect:active { transform: translateY(0); }
    .btn-detect::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent);
      pointer-events: none;
    }

    /* Scan line animation on button */
    .btn-detect::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 60%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      animation: shimmer 2.5s ease-in-out infinite;
    }
    @keyframes shimmer {
      0% { left: -100%; }
      100% { left: 200%; }
    }

    /* Plate preview badge */
    .plate-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #eef2ff;
      border: 1px solid #c7d2fe;
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 0.8rem;
      color: #4338ca;
      font-weight: 500;
      margin-top: 1.5rem;
      animation: fadeInUp 0.5s 0.8s ease both;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- Graphical background -->
  <div class="bg-scene">
    <div class="grid-overlay"></div>

    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <!-- Scan dots scattered -->
    <div class="scan-dot" style="top:18%;left:12%;animation-delay:0s"></div>
    <div class="scan-dot" style="top:35%;left:75%;animation-delay:1s"></div>
    <div class="scan-dot" style="top:62%;left:20%;animation-delay:2s"></div>
    <div class="scan-dot" style="top:25%;left:88%;animation-delay:1.5s"></div>
    <div class="scan-dot" style="top:70%;left:55%;animation-delay:0.5s"></div>

    <!-- Road -->
    <div class="road">
      <div class="road-line"></div>
      <div class="road-line"></div>
      <div class="road-line"></div>
      <div class="road-line"></div>
    </div>

    <!-- Car on road -->
    <div class="car" style="animation-duration:9s;">
      <svg width="140" height="55" viewBox="0 0 140 55" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="10" y="24" width="120" height="24" rx="8" fill="#4f46e5"/>
        <path d="M30 24 L45 8 L95 8 L110 24Z" fill="#6366f1"/>
        <rect x="48" y="10" width="20" height="12" rx="2" fill="#bfdbfe" opacity="0.9"/>
        <rect x="72" y="10" width="20" height="12" rx="2" fill="#bfdbfe" opacity="0.9"/>
        <circle cx="32" cy="48" r="9" fill="#1e1b4b"/>
        <circle cx="32" cy="48" r="5" fill="#c7d2fe"/>
        <circle cx="108" cy="48" r="9" fill="#1e1b4b"/>
        <circle cx="108" cy="48" r="5" fill="#c7d2fe"/>
        <rect x="112" y="28" width="14" height="6" rx="2" fill="#fde68a" opacity="0.9"/>
        <rect x="14" y="30" width="8" height="4" rx="1" fill="#fca5a5" opacity="0.9"/>
      </svg>
    </div>
  </div>

  <!-- Main content -->
  <div class="main-card">
    <div class="icon-badge">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="7" width="20" height="10" rx="2"/>
        <path d="M6 11h.01M18 11h.01M9 11h6"/>
        <circle cx="12" cy="3" r="1"/><circle cx="12" cy="21" r="1"/>
      </svg>
    </div>

    <h1 class="title">License Plate Detection</h1>
    <p class="subtitle">Upload a vehicle image to detect and read the license plate</p>

    <form method="POST" enctype="multipart/form-data">
      <div class="upload-zone" id="uploadZone">
        <input type="file" name="file" required id="fileInput">
        <div class="upload-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
        </div>
        <p class="upload-label">Click to upload or drag & drop</p>
        <p class="upload-hint">PNG, JPG, JPEG supported</p>
      </div>

      <button type="submit" class="btn-detect">
        🔍 &nbsp;Detect License Plate
      </button>
    </form>

    <div style="text-align:center;">
      <span class="plate-badge">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        Powered by YOLOv8 · Fast & Accurate
      </span>
    </div>
  </div>

  <script>
    const input = document.getElementById('fileInput');
    const zone = document.getElementById('uploadZone');
    const label = zone.querySelector('.upload-label');
    const hint = zone.querySelector('.upload-hint');

    input.addEventListener('change', () => {
      const file = input.files[0];
      if (file) {
        label.textContent = file.name;
        hint.textContent = (file.size / 1024).toFixed(1) + ' KB · Ready to detect';
        zone.style.borderColor = '#6366f1';
        zone.style.background = 'rgba(238,242,255,0.95)';
      }
    });

    zone.addEventListener('dragover', (e) => {
      e.preventDefault();
      zone.style.borderColor = '#6366f1';
    });
    zone.addEventListener('dragleave', () => {
      zone.style.borderColor = '#c7d2fe';
    });
    zone.addEventListener('drop', (e) => {
      e.preventDefault();
      const file = e.dataTransfer.files[0];
      if (file) {
        input.files = e.dataTransfer.files;
        label.textContent = file.name;
        hint.textContent = (file.size / 1024).toFixed(1) + ' KB · Ready to detect';
        zone.style.borderColor = '#6366f1';
      }
    });
  </script>
</body>
</html>
